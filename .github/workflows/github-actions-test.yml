name: GitHub Actions
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v2
      with:
        submodules: 'recursive'
    - name: esp-idf build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.5
        target: esp32
        command: idf.py -D SDKCONFIG_DEFAULTS="configs/sdkconfig_jade_v1_1.defaults" build all size-components size

  build-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'
      - name: Build ESP32-CAM Jade (Touch + TFT)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32
          command: idf.py -D SDKCONFIG_DEFAULTS="configs/sdkconfig_diycam_tft_esp32-cam.defaults" build
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32cam-tft-touch-firmware
          path: |
            build/jade.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/jade.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          name: ESP32-CAM Jade (Touch + TFT) ${{ github.ref_name }}
          body: |
            First release of the ESP32-CAM Jade variant with TFT display and touchscreen gesture navigation.

            Highlights:
            - Touch gestures: horizontal and vertical swipe for menu navigation; center tap to select.
            - Built against ESP-IDF v5.5 targeting `esp32`.

            Flashing (ESP-IDF):
            1. Copy defaults: `cp configs/sdkconfig_diycam_tft_esp32-cam.defaults sdkconfig.defaults`
            2. Flash: `idf.py -b 115200 flash monitor`

            Config check:
            - Ensure `CONFIG_DISPLAY_TOUCHSCREEN=y` in your sdkconfig.
